name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Rewrite root paths for GitHub Pages
        run: |
          ROOT_ITEMS=$(ls -1 | grep -v '^\.' | sed 's/\./\\./g' | paste -sd '|' -)
          find . -type f \( -name "*.html" -o -name "*.css" -o -name "*.js" \) -not -path '*/.*' -exec sed -i -E \
            -e "s|([\"'\(])/($ROOT_ITEMS)|\1/Godmorgonkebab/\2|g" \
            -e 's|href="/"|href="/Godmorgonkebab/"|g' \
            -e "s|href='/'|href='/Godmorgonkebab/'|g" {} +
        
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
