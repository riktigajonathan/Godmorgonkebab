name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Rewrite root paths for GitHub Pages
        run: |
          python3 -c '
          import os, re, glob

          root_items = [re.escape(x) for x in os.listdir(".") if not x.startswith(".")]
          pattern = re.compile(r"([\"\x27\x60\(])/(" + "|".join(root_items) + r")")

          for ext in ("**/*.html", "**/*.css", "**/*.js"):
              for path in glob.glob(ext, recursive=True):
                  with open(path, "r", encoding="utf-8") as f:
                      content = f.read()
                  updated = pattern.sub(r"\1/Godmorgonkebab/\2", content)
                  updated = updated.replace("href=\"/\"", "href=\"/Godmorgonkebab/\"")
                  updated = updated.replace("href=\x27/\x27", "href=\x27/Godmorgonkebab/\x27")
                  if updated != content:
                      with open(path, "w", encoding="utf-8") as f:
                          f.write(updated)
          '

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4